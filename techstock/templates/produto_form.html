{% extends 'base.html' %}
{% block title %}Novo Produto - TechStock{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-10"><div class="card shadow-sm border-0"><div class="card-body p-4">
<h1 class="h3 mb-4">Cadastrar produto</h1>
<form method="post">
<div class="row g-3">
<div class="col-md-4"><label class="form-label">SKU *</label><input class="form-control" name="sku" value="{{ dados.sku or '' }}" required></div>
<div class="col-md-5"><label class="form-label">Nome *</label><input class="form-control" name="nome" value="{{ dados.nome or '' }}" required></div>
<div class="col-md-3"><label class="form-label">Fabricante *</label><input class="form-control" name="fabricante" value="{{ dados.fabricante or '' }}" required></div>
<div class="col-md-4"><label class="form-label">Tipo *</label><select class="form-select" name="tipo" required><option value="">Selecione</option>{% for tipo in ['Hardware','Software','PerifÃ©rico'] %}<option value="{{ tipo }}"{% if dados.tipo == tipo %} selected{% endif %}>{{ tipo }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Modalidade de licenÃ§a</label><select class="form-select" name="modalidade_licenca"><option value="">NÃ£o se aplica</option>{% for modalidade in ['Assinatura Anual','PerpÃ©tua/ESD','OEM'] %}<option value="{{ modalidade }}"{% if dados.modalidade_licenca == modalidade %} selected{% endif %}>{{ modalidade }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">PreÃ§o (R$) *</label><input class="form-control" type="text" inputmode="decimal" name="preco" value="{{ dados.preco or '' }}" required></div>
<div class="col-md-3"><label class="form-label">Estoque atual *</label><input class="form-control" type="number" min="0" name="estoque_atual" value="{{ dados.estoque_atual or 0 }}" required></div>
<div class="col-md-3"><label class="form-label">Estoque mÃ­nimo *</label><input class="form-control" type="number" min="0" name="estoque_minimo" value="{{ dados.estoque_minimo or 0 }}" required></div>
<div class="col-md-6"><label class="form-label">LocalizaÃ§Ã£o *</label><input class="form-control" name="localizacao" value="{{ dados.localizacao or '' }}" required></div>
<div class="col-md-6"><label class="form-label">Categoria *</label><select class="form-select" name="categoria_id" required><option value="">Selecione uma categoria</option>{% for categoria in categorias %}<option value="{{ categoria.id }}"{% if dados.categoria_id|string == categoria.id|string %} selected{% endif %}>{{ categoria.nome }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Fornecedor *</label><select class="form-select" name="fornecedor_id" required><option value="">Selecione um fornecedor</option>{% for fornecedor in fornecedores %}<option value="{{ fornecedor.id }}"{% if dados.fornecedor_id|string == fornecedor.id|string %} selected{% endif %}>{{ fornecedor.razao_social }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">EspecificaÃ§Ã£o</label><textarea class="form-control" name="especificacao" rows="3">{{ dados.especificacao or '' }}</textarea></div>
</div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Salvar produto</button><a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a></div>
</form></div></div></div></div>
{% endblock %}
