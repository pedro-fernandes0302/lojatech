<div class="row g-4"><div class="col-lg-4"><div class="card shadow-sm border-0"><div class="card-body"><h1 class="h4">Nova categoria</h1><form method="post"><label class="form-label">Nome da categoria *</label><input class="form-control" name="nome" required><button class="btn btn-primary mt-3">Cadastrar</button></form></div></div></div>
